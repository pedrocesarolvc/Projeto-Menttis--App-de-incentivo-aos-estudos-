<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menttis</title>
    <link rel="stylesheet" href="estilo_criar_conta.css">
</head>
</head>
<body>
    <div class="container">
        <div class="left-section">
            <div class="app-image">
                <div class="app-image-placeholder"><img src="https://i.ibb.co/PvGs4tKV/nome-preto-2x.png"></div>
            </div>
        </div>
        
        <div class="right-section">
            <h2 class="login-title">Criar Conta</h2>
            
            <form id="register-form">
                <div class="form-group">
                    <label for="nome">Nome e Sobrenome</label>
                    <input type="text" id="nome" placeholder="Digite seu Nome:">
                </div>

                <div class="form-group">
                    <label for="celular">Celular</label>
                    <input type="tel" id="celular" placeholder="Digite seu número de celular:">
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email-criado" placeholder="Digite seu Email:">
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="new-password" placeholder="Digite sua Senha:">
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirmar Senha</label>
                    <input type="cpassword" id="cpassword" placeholder="Confirme sua senha:">
                </div>
                
                <button type="button" class="login-button" id="register-btn">Entrar</button>
            </form>
            
            <div class="footer">
                <p>&copy; GrupoEsuda</p>
            </div>
        </div>
    </div>
    
    <script src="teste.js"></script>
</body>
</html>
