<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar em grupo - Menttis</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/grupos.css">
</head>
<body data-page="entrar_grupo">
    <div id="app-shell"></div>

    <main class="page form-shell">
        <div class="card form-card">
            <h1>Junte-se a um grupo</h1>
            <p>Insira um link de convite.</p>

            <form class="join-form" id="formEntrarGrupo" action="#" method="post">
                <div class="form-group">
                    <input type="text" class="input-link" placeholder="Link de convite" aria-label="Link de convite do grupo" name="linkConvite">
                </div>
                <button type="submit" class="btn btn-primary">Entrar</button>
            </form>
            <div class="info-text">
                ✨ Use o link compartilhado pelo administrador
            </div>
        </div>
    </main>

    <script src="js/shell.js"></script>
    <script>
        const form = document.getElementById('formEntrarGrupo');
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            const link = document.querySelector('input[name="linkConvite"]').value.trim();
            if (link === '') {
                alert('Cole o link de convite do grupo.');
                return;
            }
            alert('Pedido enviado! Assim que o grupo aceitar, ele aparece em "Meus grupos".');
            window.location.href = 'meus_grupos.html';
        });
    </script>
</body>
</html>
