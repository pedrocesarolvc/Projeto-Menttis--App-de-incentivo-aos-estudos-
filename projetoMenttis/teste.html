<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Menttis · Junte-se a um grupo</title>
    
    <!-- Fontes suaves e modernas -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Navbar (mantida do original com pequenas melhorias visuais) -->
    <header class="navbar">
        <div class="icons">
            <div class="menu-icon" id="menuBtn">☰</div>
            <img src="img/sino.png" alt="notificações" class="noti">
            <img src="img/logo2.png" alt="menttis logo" class="imglogo">
            <div class="logo">Menttis</div>
        </div>
        <div class="caixa-pesquisa">
            <img src="img/lupa.png" class="icone-lupa" alt="buscar">
            <input type="text" placeholder="Pesquisar">
        </div>
    </header>

    <!-- Menu lateral -->
    <nav class="menulateral" id="menulateral">
        <div>
            <div class="topo-menu">
                <img src="img/logo2.png" class="logomen" alt="logo">
                <h2 class="nomemenu">Menttis</h2>
            </div>
            <ul>
                <li><img src="img/juntar.png" class="icones" alt=""><a href="entrar_grupo.html">Juntar ao grupo</a></li>
                <li><img src="img/criar.png" class="icones" alt=""><a href="criar_grupo.html">Criar grupo</a></li>
                <li><img src="img/config.png" class="icones" alt=""><a href="menuLateral_config.html">Configurações</a></li>
                <li><img src="img/ajuda.png" class="icones" alt=""><a href="menuLateral_ajuda.html">Ajuda & feedback</a></li>
                <li><img src="img/casa.png" class="icones" alt=""><a href="#">Início</a></li>
            </ul>
        </div>
        <button class="logout"><img src="img/sair.png" class="icones" alt=""><a href="pc/pagina_login_pc.html"> Sair</a></button>
    </nav>

    <!-- Conteúdo principal - Estilo baseado no modelo "Junte-se a um grupo" -->
    <main class="container" id="mainContent">
        <div class="join-card">
            <!-- título e descrição exatamente como no modelo -->
            <h1>Junte-se a um grupo</h1>
            <p>Insira um link de convite.</p>

            <form class="join-form" action="#" method="post">
                <!-- Caixa de input arredondada com fonte suave -->
                <input type="text" class="input-link" placeholder="Link de convite" aria-label="Link de convite do grupo">
                <button type="submit" class="btn-entrar">Entrar</button>
            </form>
            <div class="link-helper">
                ✨ Use o link compartilhado pelo administrador
            </div>
        </div>
    </main>

    <script>
        
    </script>
</body>
</html>
