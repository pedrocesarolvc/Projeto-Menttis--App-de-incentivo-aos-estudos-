<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menttis</title>
    <link rel="stylesheet" href="estilo_login_pc.css">
    <script src="login.js"></script>
</head>
</head>
<body>
    <div class="container">
        <div class="left-section">
            <div class="app-image">
                <div class="app-image-placeholder"><img src="https://i.ibb.co/PvGs4tKV/nome-preto-2x.png"></div>
            </div>
        </div>
        
        <div class="right-section">
            <h2 class="login-title">Login</h2>
            
            <form>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="text" id="email" placeholder="Digite seu email:">
                </div>
                
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Digite sua senha:">
                </div>
                
                <div class="forgot-password">
                    <a href="#">Esqueceu sua senha?</a>
                </div>
                
                <button type="submit" class="login-button" onclick="registrarLogin()"><a href="menu.html">Entrar</a></button>
                
                <div class="signup-link">
                    Não possui uma conta? <a href="pagina_criar_conta.html">Crie aqui</a>
                </div>
            </form>
            
            <div class="footer">
                <p>&copy; GrupoEsuda</p>
            </div>
        </div>
    </div>
</body>
</html>
