<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="js/tom.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Menttis</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/config.css">
    <link rel="stylesheet" href="css/tom.css">
</head>
<body data-page="config">
    <div id="app-shell"></div>

    <main class="page">
        <section class="card tom-secao">
            <h2>Aparência</h2>
            <p>Controla o quanto de decoração (emoji, comemoração) aparece pelo app — a mecânica de pontos e sequência continua a mesma nos três.</p>
            <div class="tom-opcoes" id="seletor-tom">
                <button type="button" class="tom-opcao" data-tom-opcao="direto">
                    <strong>Direto</strong>
                    <span>Sóbrio, sem emoji nem comemoração</span>
                </button>
                <button type="button" class="tom-opcao" data-tom-opcao="equilibrado">
                    <strong>Equilibrado</strong>
                    <span>O padrão do Menttis</span>
                </button>
                <button type="button" class="tom-opcao" data-tom-opcao="animado">
                    <strong>Animado</strong>
                    <span>Mais emoji, mais comemoração</span>
                </button>
            </div>
        </section>

        <div class="settings-container">
            <section class="settings-form">
                <h1>Configurações</h1>

                <label>Username</label>
                <input id="username" type="text" placeholder="Username">

                <label>Email</label>
                <input id="email" type="email" placeholder="Email">

                <label>Celular</label>
                <input id="telefone" type="text" placeholder="(  ) _____-____">

                <label>Senha</label>
                <div class="password-field">
                    <input id="senha" type="password" placeholder="Senha">
                    <span id="toggleSenha" class="toggle-eye">👁️</span>
                </div>

                <button class="btn btn-primary" id="salvarBtn">Salvar</button>
                <p id="mensagem" class="mensagem-sucesso"></p>
                <p id="erro" class="mensagem-erro"></p>
            </section>

            <section class="image-area">
                <div class="image-box">
                    <span class="img-icon">🖼️</span>
                </div>
                <button class="btn btn-ghost">Alterar imagem</button>
            </section>
        </div>
    </main>

    <script src="js/shell.js"></script>
    <script>
        menttisInicializarSeletorTom('#seletor-tom');

        const username = document.getElementById("username");
        const email = document.getElementById("email");
        const telefone = document.getElementById("telefone");
        const senha = document.getElementById("senha");
        const toggleSenha = document.getElementById("toggleSenha");
        const btnSalvar = document.getElementById("salvarBtn");
        const mensagem = document.getElementById("mensagem");
        const erroMsg = document.getElementById("erro");

        function erro(msg) {
            erroMsg.textContent = msg;
            setTimeout(() => erroMsg.textContent = "", 4000);
        }

        telefone.addEventListener("input", (e) => {
            let v = e.target.value.replace(/\D/g, "");
            if (v.length > 11) v = v.slice(0, 11);

            if (v.length >= 7) {
                e.target.value = `(${v.slice(0, 2)}) ${v.slice(2, 7)}-${v.slice(7)}`;
            } else if (v.length >= 3) {
                e.target.value = `(${v.slice(0, 2)}) ${v.slice(2)}`;
            } else if (v.length >= 1) {
                e.target.value = `(${v}`;
            }
        });

        toggleSenha.addEventListener("click", () => {
            senha.type = senha.type === "password" ? "text" : "password";
        });

        btnSalvar.addEventListener("click", () => {
            const regexUsuario = /^[A-Za-z]+$/;
            const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const regexTelefone = /^\(\d{2}\) \d{5}-\d{4}$/;

            if (!regexUsuario.test(username.value)) {
                erro("Username deve conter apenas letras.");
                return;
            }

            if (!regexEmail.test(email.value)) {
                erro("Digite um email válido.");
                return;
            }

            if (!regexTelefone.test(telefone.value)) {
                erro("Digite um número de celular válido no formato (99) 99999-9999.");
                return;
            }

            if (senha.value.length < 4) {
                erro("A senha deve ter pelo menos 4 caracteres.");
                return;
            }

            const dados = { username: username.value, email: email.value, telefone: telefone.value, senha: senha.value };
            localStorage.setItem("dadosMenttis", JSON.stringify(dados));

            mensagem.textContent = "Informações salvas no Menttis!";
            setTimeout(() => mensagem.textContent = "", 3000);
        });

        window.addEventListener('DOMContentLoaded', () => {
            const dados = JSON.parse(localStorage.getItem("dadosMenttis"));
            if (dados) {
                username.value = dados.username;
                email.value = dados.email;
                telefone.value = dados.telefone;
                senha.value = dados.senha;
            }
        });
    </script>
</body>
</html>
