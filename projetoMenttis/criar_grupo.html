<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menttis</title>
    <link rel="stylesheet" href="css/criar_grupo.css">
</head>
<body>
    <header class="navbar">
        <div class="icons">
            <div class="menu-icon" id="menuBtn">☰</div>
            <img src="img/sino.png" alt="sino" class="noti">
            <img src="img/logo2.png" alt="menttis" class="imglogo">
            <div class="logo">Menttis</div>
        </div>
        <div class="caixa-pesquisa">
            <img src="img/lupa.png" class="icone-lupa" alt="lupa">
            <input type="text" placeholder="Pesquisar">
        </div>
    </header>

    <!-- Menu lateral -->
    <nav class="menulateral" id="menulateral">
        <div class="topo-menu">
            <img src="img/logo2.png" class="logomen">
            <h2 class="nomemenu">Menttis</h2>
        </div>
        <ul>
            <li><img src="img/juntar.png" class="icones"><a href="entrar_grupo.html">Juntar ao grupo</a></li>
            <li><img src="img/criar.png" class="icones"><a href="criar_grupo.html">Criar grupo</a></li>
            <li><img src="img/config.png" class="icones"><a href="menuLateral_config.html">Configurações</a></li>
            <li><img src="img/ajuda.png" class="icones"><a href="menuLateral_ajuda.html">Ajuda & feedback</a></li>
            <li><img src="img/casa.png" class="icones"><a href="#">Início</a></li>
        </ul>
        <button class="logout"><img src="img/sair.png" class="icones"><a href="pc/pagina_login_pc.html"> Sair</a></button>
    </nav>

    <!-- Conteúdo principal -->
    <main class="container" id="mainContent">
        <div class="create-card">
            <h1>Crie seu Grupo!</h1>
            <form id="formCriarGrupo" action="#" method="post">
                <div class="form-group">
                    <label>📌 Escolha um nome para o grupo.</label>
                    <input type="text" class="input-moderno" placeholder="Ex: Matemática Enem, Coders, Estudos Livres" name="nomeGrupo" required>
                </div>

                <div class="form-group">
                    <label>✏️ Crie uma descrição.</label>
                    <textarea class="textarea-moderno" placeholder="Descreva o foco do grupo, objetivos ou regras (opcional mas recomendado)" name="descricao" rows="3"></textarea>
                </div>

                <button type="submit" class="btn-criar">Criar Grupo</button>
                <div class="info-text">
                    🌟 Seu grupo ficará visível para outros estudantes
                </div>
            </form>
        </div>
    </main>


    <!-- JavaScript para abrir/fechar o menu -->
    <script>
        (function() {
            const menu = document.getElementById('menulateral');
            const menuBtn = document.getElementById('menuBtn');
            const mainContent = document.getElementById('mainContent');
            const MENU_WIDTH = 300;
            
            let isMenuOpen = false;

            if (menu) menu.style.left = '-300px';
            if (mainContent) mainContent.style.marginLeft = '0px';

            if (menuBtn) {
                menuBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!isMenuOpen) {
                        menu.style.left = '0px';
                        mainContent.style.marginLeft = MENU_WIDTH + 'px';
                        isMenuOpen = true;
                    } else {
                        menu.style.left = '-' + MENU_WIDTH + 'px';
                        mainContent.style.marginLeft = '0px';
                        isMenuOpen = false;
                    }
                });
            }

            if (mainContent) {
                mainContent.addEventListener('click', () => {
                    if (isMenuOpen) {
                        menu.style.left = '-' + MENU_WIDTH + 'px';
                        mainContent.style.marginLeft = '0px';
                        isMenuOpen = false;
                    }
                });
            }

            if (menu) {
                menu.addEventListener('click', (e) => e.stopPropagation());
            }
        })();

                const form = document.getElementById('formCriarGrupo');
        if (form) {
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const nomeInput = document.querySelector('input[name="nomeGrupo"]');
                const nomeGrupo = nomeInput ? nomeInput.value.trim() : '';
                if (nomeGrupo === '') {
                    alert('Por favor, escolha um nome para o grupo.');
                    return;
                }
                alert(`Grupo "${nomeGrupo}" criado com sucesso!`);
            });
        }
    </script>

</body>
</html>
