<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menttis</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/grupos.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body data-page="menu">
    <div id="app-shell"></div>

    <main class="page">
        <section class="dashboard-header">
            <h1 id="saudacao">Olá!</h1>
            <p>Bora continuar a sequência de hoje?</p>
        </section>

        <section class="stats-row">
            <div class="card stat-card">
                <div class="stat-icon"><i class='bx bxs-graduation'></i></div>
                <div>
                    <div class="stat-label">Nível</div>
                    <div class="stat-value" id="valor-nivel">—</div>
                </div>
            </div>
            <div class="card stat-card">
                <div class="stat-icon"><i class='bx bxs-bolt'></i></div>
                <div style="flex:1">
                    <div class="stat-label">XP para o próximo nível</div>
                    <div class="stat-value" id="valor-xp">—</div>
                    <div class="progress-bar"><i id="barra-xp" style="width:0%"></i></div>
                </div>
            </div>
            <div class="card stat-card streak">
                <div class="stat-icon"><i class='bx bxs-flame'></i></div>
                <div>
                    <div class="stat-label">Sequência</div>
                    <div class="stat-value" id="valor-sequencia">—</div>
                </div>
            </div>
        </section>

        <section class="quick-actions">
            <button type="button" class="quick-action destaque" id="btn-estudar-solo">
                <span class="qa-icon"><i class='bx bxs-rocket'></i></span>
                <h3>Estudar sozinho</h3>
                <p>Perguntas rápidas sobre qualquer assunto, no seu ritmo.</p>
            </button>
            <a href="criar_grupo.html" class="quick-action">
                <span class="qa-icon"><i class='bx bx-plus-circle'></i></span>
                <h3>Criar grupo</h3>
                <p>Monte uma equipe e convide outros estudantes.</p>
            </a>
            <a href="entrar_grupo.html" class="quick-action">
                <span class="qa-icon"><i class='bx bx-link-alt'></i></span>
                <h3>Entrar em grupo</h3>
                <p>Já tem um link de convite? Entre em segundos.</p>
            </a>
        </section>

        <section class="groups-section">
            <div class="section-head">
                <h2>Seus grupos</h2>
                <a href="meus_grupos.html">Ver todos</a>
            </div>
            <div class="groups-carousel">
                <button class="arrow-btn" id="seta-esquerda" aria-label="Rolar para a esquerda"><i class='bx bx-chevron-left'></i></button>
                <div class="carousel-track" id="trilha-grupos"></div>
                <button class="arrow-btn" id="seta-direita" aria-label="Rolar para a direita"><i class='bx bx-chevron-right'></i></button>
            </div>
        </section>
    </main>

    <script src="js/shell.js"></script>
    <script src="js/mockData.js"></script>
    <script>
        document.getElementById('saudacao').textContent = `Olá, ${MENTTIS_USUARIO.nome}!`;
        document.getElementById('valor-nivel').textContent = `Nível ${MENTTIS_USUARIO.nivel}`;
        document.getElementById('valor-xp').textContent = `${MENTTIS_USUARIO.xp} / ${MENTTIS_USUARIO.xpProximoNivel} XP`;
        document.getElementById('valor-sequencia').textContent = `${MENTTIS_USUARIO.sequenciaDias} dias`;
        document.getElementById('barra-xp').style.width = Math.round((MENTTIS_USUARIO.xp / MENTTIS_USUARIO.xpProximoNivel) * 100) + '%';

        document.getElementById('btn-estudar-solo').addEventListener('click', () => {
            alert('Em breve: sessão de estudo solo com perguntas geradas por IA. 🎯');
        });

        const trilha = document.getElementById('trilha-grupos');
        MENTTIS_GRUPOS.forEach((grupo) => {
            const a = document.createElement('a');
            a.href = `grupo_detalhe.html?id=${grupo.id}`;
            a.className = 'card group-card-mini';
            a.innerHTML = `
                <div class="card-subject">${grupo.materia}</div>
                <div class="card-name">${grupo.nome}</div>
                <div class="avatar-stack">${grupo.membros.slice(0, 3).map((m) => `<span class="avatar" style="background:${m.cor}">${m.iniciais}</span>`).join('')}</div>
                <span class="badge ${grupo.desafio.ativo ? 'badge-live' : 'badge-idle'}">${grupo.desafio.ativo ? '🔥 Desafio ativo' : 'Sem desafio'}</span>
            `;
            trilha.appendChild(a);
        });

        document.getElementById('seta-esquerda').addEventListener('click', () => trilha.scrollBy({ left: -220, behavior: 'smooth' }));
        document.getElementById('seta-direita').addEventListener('click', () => trilha.scrollBy({ left: 220, behavior: 'smooth' }));
    </script>
</body>
</html>
