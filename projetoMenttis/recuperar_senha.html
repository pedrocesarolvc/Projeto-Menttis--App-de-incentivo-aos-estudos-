<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha - Menttis</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="container">
        <div class="left-section">
            <div class="app-image">
                <div class="app-image-placeholder"><img src="img/logo.png" alt="Menttis"></div>
            </div>
        </div>

        <div class="right-section">
            <h2 class="login-title">Recuperar senha</h2>
            <p class="login-subtitle">Digite o e-mail da sua conta. Vamos enviar um link para você criar uma senha nova.</p>

            <p id="mensagem-sucesso" class="mensagem-sucesso" hidden></p>

            <form id="form-recuperar">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Digite seu email:">
                </div>

                <button type="submit" class="login-button" id="enviar-btn">Enviar link de recuperação</button>

                <div class="signup-link">
                    Lembrou a senha? <a href="pc/pagina_login_pc.html">Voltar para o login</a>
                </div>
            </form>

            <div class="footer">
                <p>&copy; GrupoEsuda</p>
            </div>
        </div>
    </div>

    <script src="js/recuperarSenha.js"></script>
</body>
</html>
